# 한결공조 ERP Mock — Cloudflare Workers 설정
# API 키는 여기에 쓰지 않음: 배포는 `npx wrangler secret put API_KEY`, 로컬은 .dev.vars (Git 제외)
name = "hg-erp-mock"
main = "src/index.js"
compatibility_date = "2026-10-01"
# DESC: 주소 https://hg-erp-mock.hg-erp-mock.workers.dev 만 사용, 버전별 미리보기 주소는 끔
workers_dev = true
preview_urls = false

[[d1_databases]]
# DESC: binding은 코드(src/index.js)에서 쓰는 이름 env.DB와 같아야 함 (d1 create 출력의 제안 이름과 달라도 됨)
binding = "DB"
database_name = "hg-erp-mock"
database_id = "7b49ab61-c809-4cd4-9b6c-3a10fe6b5b92"

[vars]
# DESC: IF-02 푸시 대상 Salesforce(My Domain). 비밀 값 아님. 고객 키·암호는 secret으로만:
#       npx wrangler secret put SF_CLIENT_ID / npx wrangler secret put SF_CLIENT_SECRET (값은 직접 입력, 파일·Git에 남기지 않음)
SF_INSTANCE_URL = "https://orgfarm-68b5e672a0-dev-ed.develop.my.salesforce.com"
