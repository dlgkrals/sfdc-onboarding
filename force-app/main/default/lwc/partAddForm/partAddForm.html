<template>
  <div class="slds-p-horizontal_medium slds-p-vertical_small form-area">
    <h3 class="slds-text-heading_small slds-m-bottom_x-small">
      {labels.LABEL_PART_ADD_TITLE}
    </h3>
    <p lwc:if={hasNoStock} class="slds-text-color_weak">
      {labels.MSG_NO_VAN_STOCK}
    </p>
    <div
      lwc:else
      class="slds-grid slds-wrap slds-gutters_small slds-grid_vertical-align-end"
    >
      <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12">
        <!-- 재고 선택: 이 출동 담당 기사 차량의 재고만. 남은 수량 0은 보이되 고를 수 없음(disabled) -->
        <div class={stockFieldClass}>
          <label class="slds-form-element__label" for="stock">
            <abbr class="slds-required" title="required">* </abbr
            >{labels.LABEL_STOCK}
          </label>
          <div class="slds-form-element__control">
            <div class="slds-select_container">
              <select
                class="slds-select"
                id="stock"
                name="stock"
                required
                aria-describedby="stock-help"
                onchange={handleStockChange}
              >
                <option value="">{labels.MSG_PART_SELECT_REQUIRED}</option>
                <template for:each={stockOptions} for:item="option">
                  <option
                    key={option.value}
                    value={option.value}
                    disabled={option.disabled}
                    selected={option.selected}
                  >
                    {option.label}
                  </option>
                </template>
              </select>
            </div>
          </div>
          <div
            lwc:if={stockError}
            class="slds-form-element__help"
            id="stock-help"
          >
            {stockError}
          </div>
        </div>
      </div>
      <div class="slds-col slds-size_1-of-2 slds-medium-size_3-of-12">
        <lightning-input
          name="quantity"
          type="number"
          label={quantityLabel}
          value={quantity}
          step="0.01"
          min="0.01"
          message-when-range-underflow={labels.MSG_QUANTITY_INVALID}
          onchange={handleQuantityChange}
          required
        ></lightning-input>
      </div>
      <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12">
        <lightning-button
          variant="brand"
          label={labels.BTN_ADD_PART}
          icon-name="utility:add"
          onclick={handleAdd}
          disabled={isSaving}
          class="slds-button_stretch"
        ></lightning-button>
      </div>
    </div>
    <lightning-spinner
      lwc:if={isSaving}
      alternative-text="Saving"
      size="small"
    ></lightning-spinner>
  </div>
</template>
