<template>
  <div class="cards">
    <lightning-spinner
      lwc:if={isLoading}
      alternative-text="Loading"
      size="small"
    ></lightning-spinner>

    <p lwc:if={isEmpty} class="slds-text-color_weak slds-p-around_small">
      {labels.MSG_CARD_EMPTY}
    </p>

    <div lwc:if={errorMessage} class="slds-text-color_error" role="alert">
      {errorMessage}
    </div>

    <!-- 고객사 카드 -->
    <article lwc:if={account} class="slds-box slds-m-bottom_small">
      <p class="slds-text-title_caps slds-text-color_weak">
        {labels.LABEL_ACCOUNT_CARD}
      </p>
      <h3 class="slds-text-heading_small slds-m-bottom_x-small">
        {account.name}
      </h3>
      <dl class="slds-list_horizontal slds-wrap">
        <template for:each={accountFacts} for:item="fact">
          <dt
            key={fact.labelKey}
            class="slds-item_label slds-text-color_weak slds-truncate"
          >
            {fact.label}
          </dt>
          <dd key={fact.valueKey} class="slds-item_detail">
            <lightning-badge
              lwc:if={fact.badge}
              label={fact.badge}
              icon-name="utility:warning"
              class={statusBadgeClass}
            ></lightning-badge>
            <template lwc:else>{fact.value}</template>
          </dd>
        </template>
      </dl>
    </article>

    <!-- 사업장 카드 -->
    <article lwc:if={site} class="slds-box">
      <p class="slds-text-title_caps slds-text-color_weak">
        {labels.LABEL_SITE_CARD}
      </p>
      <div
        class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small"
      >
        <h3 class="slds-text-heading_small slds-m-right_x-small">
          {site.name}
        </h3>
        <lightning-badge
          lwc:if={site.isUrgentUsage}
          label={labels.LABEL_URGENT_USAGE}
          icon-name="utility:priority"
          class="slds-theme_error"
        ></lightning-badge>
      </div>
      <dl class="slds-list_horizontal slds-wrap">
        <template for:each={siteFacts} for:item="fact">
          <dt
            key={fact.labelKey}
            class="slds-item_label slds-text-color_weak slds-truncate"
          >
            {fact.label}
          </dt>
          <dd key={fact.valueKey} class="slds-item_detail">{fact.value}</dd>
        </template>
      </dl>
    </article>
  </div>
</template>
