<template>
  <lightning-card title={title} icon-name="standard:case">
    <lightning-button-icon
      slot="actions"
      icon-name="utility:refresh"
      alternative-text="Refresh"
      onclick={handleRefresh}
    ></lightning-button-icon>

    <div class="table-area">
      <lightning-spinner
        lwc:if={isLoading}
        alternative-text="Loading"
        size="small"
      ></lightning-spinner>
      <lightning-datatable
        lwc:if={hasRows}
        key-field="id"
        data={rows}
        columns={columns}
        hide-checkbox-column
        column-widths-mode="auto"
      ></lightning-datatable>
      <p lwc:if={isEmpty} class="slds-p-horizontal_medium slds-text-color_weak">
        {labels.MSG_NO_RECENT_CASES}
      </p>
      <p
        lwc:if={errorMessage}
        class="slds-p-horizontal_medium slds-text-color_error"
      >
        {errorMessage}
      </p>
    </div>

    <div lwc:if={showViewAll} slot="footer">
      <lightning-button
        variant="base"
        label={labels.BTN_VIEW_ALL}
        onclick={handleViewAll}
      ></lightning-button>
    </div>
  </lightning-card>
</template>
