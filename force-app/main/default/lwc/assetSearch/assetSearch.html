<template>
  <lightning-card
    title={labels.LABEL_ASSET_SEARCH_TITLE}
    icon-name="standard:asset_object"
  >
    <div class="slds-p-horizontal_medium">
      <div
        class="slds-grid slds-wrap slds-grid_vertical-align-end slds-gutters_small"
      >
        <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
          <lightning-input
            type="search"
            label={labels.LABEL_SEARCH}
            placeholder={labels.MSG_SEARCH_PLACEHOLDER}
            onchange={handleSearchChange}
          ></lightning-input>
        </div>
        <div
          class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-bottom_x-small"
        >
          <lightning-input
            type="checkbox"
            label={labels.LABEL_REPEAT_ONLY}
            checked={repeatOnly}
            onchange={handleRepeatOnlyChange}
          ></lightning-input>
        </div>
      </div>
    </div>

    <div class="slds-m-top_small table-area">
      <lightning-spinner
        lwc:if={isLoading}
        alternative-text="Loading"
        size="small"
      ></lightning-spinner>
      <lightning-datatable
        key-field="id"
        data={rows}
        columns={columns}
        sorted-by={sortedBy}
        sorted-direction={sortedDirection}
        onsort={handleSort}
        onrowaction={handleRowAction}
        hide-checkbox-column
        column-widths-mode="auto"
      ></lightning-datatable>
      <p lwc:if={isEmpty} class="slds-p-around_medium slds-text-color_weak">
        {labels.MSG_ASSET_NOT_FOUND}
      </p>
    </div>

    <div
      slot="footer"
      class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
    >
      <lightning-button
        label={labels.BTN_PREVIOUS}
        icon-name="utility:chevronleft"
        onclick={handlePrevious}
        disabled={isFirstPage}
      ></lightning-button>
      <span class="slds-text-body_small">{pageInfo}</span>
      <lightning-button
        label={labels.BTN_NEXT}
        icon-name="utility:chevronright"
        icon-position="right"
        onclick={handleNext}
        disabled={isLastPage}
      ></lightning-button>
    </div>
  </lightning-card>
</template>
