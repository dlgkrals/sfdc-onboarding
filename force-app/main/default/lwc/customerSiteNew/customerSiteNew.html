<template>
  <lightning-card
    title={labels.LABEL_SITE_NEW_TITLE}
    icon-name="standard:location"
  >
    <lightning-record-edit-form
      object-api-name="CustomerSite__c"
      onsubmit={handleSubmit}
      onsuccess={handleSuccess}
      onerror={handleError}
    >
      <lightning-messages></lightning-messages>
      <div class="slds-grid slds-wrap slds-gutters slds-p-horizontal_medium">
        <!-- 왼쪽: 사업장 정보 -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
          <h3 class="slds-text-heading_small slds-m-bottom_small">
            {labels.LABEL_SITE_INFO}
          </h3>
          <lightning-input-field
            field-name="Account__c"
            value={effectiveParentId}
            required
          ></lightning-input-field>
          <lightning-input-field
            field-name="Name"
            required
          ></lightning-input-field>
          <lightning-input-field
            field-name="UsageType__c"
          ></lightning-input-field>
          <!-- 서비스센터: 고르지 않음. 주소로 자동 지정될 센터를 표시만 -->
          <div
            class="slds-form-element slds-m-bottom_small slds-p-horizontal_xx-small"
          >
            <span class="slds-form-element__label"
              >{labels.LABEL_SERVICE_CENTER}</span
            >
            <p class={centerMessageClass}>{centerMessage}</p>
          </div>
          <lightning-input-field
            field-name="OnSiteContactName__c"
          ></lightning-input-field>
          <lightning-input-field
            field-name="OnSiteContactPhone__c"
          ></lightning-input-field>
          <lightning-input-field
            field-name="SecondaryContactPhone__c"
          ></lightning-input-field>
          <lightning-input-field
            field-name="AccessCondition__c"
          ></lightning-input-field>
          <lightning-input-field
            field-name="WorkAvailableStartTime__c"
          ></lightning-input-field>
          <lightning-input-field
            field-name="WorkAvailableEndTime__c"
          ></lightning-input-field>
          <lightning-input-field
            field-name="ContractSlaHours__c"
          ></lightning-input-field>
        </div>

        <!-- 오른쪽: 주소 (공통 주소 검색 부품 재사용) -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
          <h3 class="slds-text-heading_small slds-m-bottom_small">
            {labels.LABEL_ADDRESS}
          </h3>
          <template lwc:if={hasSelected}>
            <div class="slds-box slds-theme_shade slds-m-bottom_small">
              <p class="slds-text-title">{labels.LABEL_SELECTED_ADDRESS}</p>
              <p class="slds-text-body_regular">{selected.roadAddress}</p>
              <p class="slds-text-body_small slds-text-color_weak">
                {labels.LABEL_POSTAL_CODE} {selected.postalCode}
              </p>
              <lightning-button
                variant="base"
                label={labels.BTN_RESELECT}
                onclick={handleReselect}
                class="slds-m-top_x-small"
              ></lightning-button>
            </div>
            <lightning-input
              label={labels.LABEL_DETAIL_ADDRESS}
              value={detailAddress}
              onchange={handleDetailChange}
              max-length="200"
            ></lightning-input>
          </template>
          <template lwc:else>
            <p
              class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small"
            >
              {labels.MSG_ADDRESS_SEARCH_REQUIRED}
            </p>
            <c-address-search
              onaddressselected={handleAddressSelected}
            ></c-address-search>
          </template>
        </div>
      </div>

      <div
        class="slds-p-around_medium slds-text-align_right slds-border_top slds-m-top_medium"
      >
        <lightning-button
          label={labels.BTN_CANCEL}
          onclick={handleCancel}
          class="slds-m-right_x-small"
        ></lightning-button>
        <lightning-button
          variant="brand"
          type="submit"
          label={labels.BTN_SAVE}
          disabled={isSaving}
        ></lightning-button>
      </div>
    </lightning-record-edit-form>
    <lightning-spinner
      lwc:if={isSaving}
      alternative-text="Saving"
      size="small"
    ></lightning-spinner>
  </lightning-card>
</template>
