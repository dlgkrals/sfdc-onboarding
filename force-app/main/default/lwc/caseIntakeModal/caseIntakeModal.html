<template>
  <lightning-modal-header
    label={labels.LABEL_CASE_INTAKE_TITLE}
  ></lightning-modal-header>

  <lightning-modal-body>
    <div class="body-area">
      <lightning-spinner
        lwc:if={isLoading}
        alternative-text="Loading"
        size="small"
      ></lightning-spinner>

      <!-- 통화 요약: 착신 정보 + 판정 결과 (착신 모드만) -->
      <div
        lwc:if={isCallMode}
        class="slds-box slds-theme_shade slds-m-bottom_small"
      >
        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
          {labels.LABEL_CALL_SUMMARY}
        </h3>
        <dl class="slds-list_horizontal slds-wrap slds-m-bottom_x-small">
          <template for:each={callFacts} for:item="fact">
            <dt
              key={fact.labelKey}
              class="slds-item_label slds-text-color_weak slds-truncate"
            >
              {fact.label}
            </dt>
            <dd key={fact.valueKey} class="slds-item_detail">{fact.value}</dd>
          </template>
        </dl>
        <ul class="slds-list_dotted">
          <template for:each={summaryLines} for:item="line">
            <li key={line.key}>{line.text}</li>
          </template>
        </ul>
      </div>

      <!-- 고객사: 후보 여러 곳 → 목록, 아니면 검색(채워진 값 포함) -->
      <div class="slds-m-bottom_small">
        <template lwc:if={hasAccountCandidates}>
          <lightning-combobox
            label={labels.LABEL_COL_ACCOUNT}
            placeholder={labels.MSG_SELECT_PLACEHOLDER}
            options={accountComboOptions}
            value={accountId}
            onchange={handleAccountSelect}
          ></lightning-combobox>
        </template>
        <template lwc:else>
          <lightning-record-picker
            label={labels.LABEL_COL_ACCOUNT}
            placeholder={labels.MSG_SEARCH_RECORD}
            object-api-name="Account"
            value={accountId}
            onchange={handleAccountPick}
          ></lightning-record-picker>
        </template>
      </div>

      <!-- 사업장: 고른 고객사의 사업장 목록. 고르면 장비 후보 갱신 -->
      <div class="slds-m-bottom_small">
        <lightning-combobox
          label={labels.LABEL_SITE}
          placeholder={labels.MSG_SELECT_PLACEHOLDER}
          options={siteComboOptions}
          value={siteId}
          disabled={isSiteDisabled}
          onchange={handleSiteSelect}
        ></lightning-combobox>
      </div>

      <!-- 장비: 후보 목록(1대 선택) + 다른 장비 검색 -->
      <div class="slds-m-bottom_small">
        <div
          class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end"
        >
          <span class="slds-form-element__label">{labels.LABEL_ASSET}</span>
          <lightning-button
            variant="base"
            label={summaryButtonLabel}
            disabled={isSummaryDisabled}
            onclick={handleToggleSummary}
          ></lightning-button>
        </div>
        <div lwc:if={hasAssetCandidates} class="asset-table">
          <lightning-datatable
            key-field="id"
            data={assetRows}
            columns={assetColumns}
            max-row-selection="1"
            selected-rows={selectedAssetRows}
            onrowselection={handleAssetRowSelect}
            column-widths-mode="auto"
          ></lightning-datatable>
        </div>
        <lightning-record-picker
          class="slds-m-top_x-small"
          label={labels.LABEL_ASSET}
          variant="label-hidden"
          placeholder={labels.MSG_SEARCH_RECORD}
          object-api-name="Asset"
          filter={assetFilter}
          display-info={assetDisplayInfo}
          matching-info={assetMatchingInfo}
          onchange={handleAssetPick}
        ></lightning-record-picker>
        <p
          class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small"
        >
          {labels.MSG_ASSET_SAVE_HINT}
        </p>
      </div>

      <div lwc:if={showSummary} class="slds-box slds-m-bottom_small">
        <c-asset-summary asset-id={selectedAssetId}></c-asset-summary>
      </div>

      <!-- 접수 내용 -->
      <div class="slds-m-bottom_small">
        <lightning-combobox
          label={labels.LABEL_COL_SYMPTOM}
          placeholder={labels.MSG_SELECT_PLACEHOLDER}
          options={symptomOptions}
          value={symptom}
          onchange={handleSymptomChange}
        ></lightning-combobox>
      </div>
      <div class="slds-m-bottom_small">
        <lightning-input
          label={labels.LABEL_SUBJECT}
          value={subject}
          max-length="255"
          onchange={handleSubjectChange}
        ></lightning-input>
      </div>
      <lightning-textarea
        label={labels.LABEL_DESCRIPTION}
        value={description}
        onchange={handleDescriptionChange}
      ></lightning-textarea>

      <div
        lwc:if={errorMessage}
        class="slds-m-top_small slds-text-color_error"
        role="alert"
      >
        {errorMessage}
      </div>
    </div>
  </lightning-modal-body>

  <lightning-modal-footer>
    <lightning-button
      label={labels.BTN_CANCEL}
      onclick={handleCancel}
      disabled={isSaving}
      class="slds-m-right_x-small"
    ></lightning-button>
    <lightning-button
      variant="brand"
      label={labels.BTN_SAVE_CASE}
      onclick={handleSave}
      disabled={isSaveDisabled}
    ></lightning-button>
  </lightning-modal-footer>
</template>
